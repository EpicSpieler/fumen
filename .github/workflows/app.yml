name: Backend

# Only when the Rust side or the sidecar changes: the frontend's tests run on the PC before a release.
on:
  push:
    branches: [main]
    paths: ["src-tauri/**", "sidecar/**", "scripts/**", "lazer-compat.json", ".github/workflows/app.yml"]
  pull_request:
    paths: ["src-tauri/**", "sidecar/**", "scripts/**", "lazer-compat.json", ".github/workflows/app.yml"]

# the workflow only reads the repository
permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # dependencies unoptimised in CI: much faster to compile, irrelevant for the unit tests
  # (substituted into the scripts as text, so bash sees the quotes)
  CARGO_FLAGS: --manifest-path src-tauri/Cargo.toml --config 'profile.dev.package."*".opt-level=0'

jobs:
  check:
    name: Sidecar, clippy, tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      # generate_context! embeds the built frontend, and tauri-build checks that the sidecar exists
      - run: npx vite build
      - run: node scripts/build-sidecar.mjs
      - run: cargo clippy ${{ env.CARGO_FLAGS }} --all-targets
      - run: cargo test ${{ env.CARGO_FLAGS }}
