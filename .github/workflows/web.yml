name: Frontend

on:
  push:
    branches: [main]
    paths: ["src/**", "index.html", "public/**", "package.json", "package-lock.json", "tsconfig*.json", "vite.config.ts", "tools/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["src/**", "index.html", "public/**", "package.json", "package-lock.json", "tsconfig*.json", "vite.config.ts", "tools/**", ".github/workflows/web.yml"]

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ui
      - run: npx vite build
