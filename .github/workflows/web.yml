name: Frontend

on:
  push:
    branches: [main]
    paths: ["src/**", "index.html", "public/**", "package.json", "package-lock.json", "tsconfig*.json", "vite.config.ts", "tools/**", "site/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["src/**", "index.html", "public/**", "package.json", "package-lock.json", "tsconfig*.json", "vite.config.ts", "tools/**", "site/**", ".github/workflows/web.yml"]

# the workflow only reads the repository
permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ui
      - run: npx vite build
