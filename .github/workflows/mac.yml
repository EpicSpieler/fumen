name: macOS

# The macOS app, built on GitHub's Macs (a Mac app can't be built on Windows). Started by hand
# (scripts/mac-build.mjs), with milestone releases.
#
# Apple Silicon is also tested for real, in a job of its own (so nothing downloaded there can touch
# the disk images): osu!lazer's macOS release (from GitHub, ppy/osu) goes into ~/Applications, and
# Fumen's importer runs lazer's own import into a fresh library, read back by Fumen's reader
# (lazer_import::tests::importer_on_fresh_library).
on:
  workflow_dispatch:

# the workflow only reads the repository (and lazer's public release)
permissions:
  contents: read

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lazer:
    name: Import into lazer (Apple Silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          key: lazer
      - run: npm ci
      - run: node scripts/build-sidecar.mjs --target aarch64-apple-darwin
      - name: osu!lazer (its release on GitHub)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo ppy/osu --pattern 'osu.app.Apple.Silicon.zip' --output lazer.zip
          mkdir -p ~/Applications
          ditto -x -k lazer.zip ~/Applications
          rm lazer.zip
          cat ~/Applications/osu!.app/Contents/MacOS/sq.version
      - name: Import into lazer, read back
        run: |
          npx vite build
          cargo test --manifest-path src-tauri/Cargo.toml --config 'profile.dev.package."*".opt-level=0' --lib lazer_import::tests::importer_on_fresh_library -- --ignored --exact --nocapture

  build:
    name: ${{ matrix.name }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            target: aarch64-apple-darwin
          - name: Intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - run: npm ci
      - run: node scripts/build-sidecar.mjs --target ${{ matrix.target }}
      - run: npx tauri build --target ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fumen-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
