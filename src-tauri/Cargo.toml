[package]
name = "fumen"
version = "1.3.7"
description = "Fumen — a beatmap library for osu!"
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0-or-later"

[lib]
# `_lib` keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "fumen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "webp"] }
thiserror = "2"
ureq = "3"
getrandom = "0.3"
lzma-rs = "0.3"
md-5 = "0.10"
notify = { version = "8", default-features = false }
zip = { version = "4.6", default-features = false, features = ["deflate"] }
tauri-plugin-updater = "2"
# pp and star ratings (src/pp.rs). A fork of rosu-pp that follows osu!'s algorithms after rosu-pp 4.0.1
# (which is behind live for osu! and osu!taiko); back to rosu-pp once it catches up.
rosu-pp = { package = "rosu-pp-gemini", version = "=5.0.4" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }

# the webview's own settings (hardware acceleration); the version Tauri's wry uses
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
# WebKit's inspector, for finding what's slow there (open_inspector)
tauri = { version = "2", features = ["devtools"] }

[dev-dependencies]
sha2 = "0.10"
flate2 = "1"

# Image decoding, SQLite and JSON parsing are painfully slow unoptimised; keep dev builds usable.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
# panics unwind, so one bad file (a chart, an image, a replay) costs only what it was for: the
# workers catch them, and a crash at start-up can't repeat on every launch
panic = "unwind"
